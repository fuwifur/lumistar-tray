name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache-dependency-path: go.sum

      - name: Install NSIS and MinGW (windres)
        run: choco install nsis mingw -y --no-progress

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: lumistar
          path: |
            Lumistar.exe
            Lumistar-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Lumistar.exe
            Lumistar-Setup.exe
          generate_release_notes: true

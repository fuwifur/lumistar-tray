name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          check-latest: true
          cache-dependency-path: go.sum

      - name: Install NSIS and MinGW (windres)
        run: choco install nsis mingw -y --no-progress

      - name: Print tool versions
        shell: pwsh
        run: |
          go version
          try { makensis -VERSION } catch { 'makensis not on PATH' }
          try { windres --version | Select-Object -First 1 } catch { 'windres not on PATH' }

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Write SHA256SUMS
        shell: pwsh
        run: |
          Get-FileHash Lumistar.exe, Lumistar-Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content -Encoding ascii SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: lumistar
          path: |
            Lumistar.exe
            Lumistar-Setup.exe
            SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Lumistar.exe
            Lumistar-Setup.exe
            SHA256SUMS.txt
          generate_release_notes: true
